[package]
name = "loglens-api"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0.100"
argon2 = "0.5"
axum = "0.8.4"
axum-extra = { version = "0.10", features = ["multipart"] }
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5.47", features = ["derive", "env"] }
hex = "0.4"
parser-core = { path = "../../crates/parser-core" }
parser-sfdc-benchmarks = { path = "../../crates/parser-sfdc-benchmarks" }
rand = "0.9"
serde = { version = "1.0.227", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10"
sqlx = { version = "0.8.6", features = ["postgres", "runtime-tokio-rustls", "migrate", "chrono"] }
tokio = { version = "1.47.1", features = ["macros", "rt-multi-thread", "signal", "sync"] }
tower = "0.5"
tower_governor = "0.8"
tower-http = { version = "0.6", features = ["cors", "limit", "set-header"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter", "fmt"] }
utoipa = { version = "5.4.0", features = ["axum_extras"] }
